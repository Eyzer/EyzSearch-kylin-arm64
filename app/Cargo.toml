[package]
name = "search-tool"
version = "0.1.0"
description = "EyzSearch —— 本地全文搜索引擎"
authors = ["Eyzer <eyzer@qq.com>"]
edition = "2021"

# 可执行文件名：对外统一叫 eyzsearch（包名/lib 名保持不变，避免牵动
# `search_tool_lib::` 的全部引用与既有第三方补丁路径）
[[bin]]
name = "eyzsearch"
path = "src/main.rs"

[lib]
name = "search_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# 麒麟 V10（webkit2gtk-4.0 / glibc 2.28）只能用 Tauri 1：Tauri 2 的 wry 硬依赖
# webkit2gtk-4.1（需 glibc 2.36+），V10 装不上。
tauri-build = { version = "1.5", features = [] }

# indexmap 1.9.3 的 `[features]` 未声明 `default`（也无 `std` 默认启用），
# build.rs 仅靠 autocfg 探测 sysroot 来 emit `has_std`；本机探测失败 →
# indexmap 以 no_std 形态编译 → `IndexMap<K, V, S = RandomState>` 的默认
# 类型参数消失 → schemars 0.8.22 的 `pub type Map<K, V> = indexmap::IndexMap<K, V>`
# 触发 E0107（expected 3 generic arguments）。
# 显式声明 indexmap 1.x 并启用 `std`：Cargo 特性在依赖图中求并集，
# 使 indexmap 的 `CARGO_FEATURE_STD` 恒被设置，build.rs 直接 emit `has_std`，
# 不再依赖 autocfg 探测。不改变任何上游行为，待上游修复后可移除。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
stcore = { path = "../stcore" }
tauri = { version = "1.8", features = ["system-tray", "icon-png", "dialog-all"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
ignore = "0.4"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
clap = { version = "4", features = ["derive"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

# --- P0+ 子项 2：文件操作全家桶 ---
open = "5"
trash = "5"
arboard = "3"
fs_extra = "1"
rust_xlsxwriter = "0.9"

# --- P0+ 子项 3：索引管理（globset 规则/类型表；定时用 std::thread 不引 tokio） ---
globset = "0.4"

# --- P0+ 子项 5：应用外壳 ---
# Tauri 1 下这三个能力改为内置实现：
#   开机启动 → 自写 ~/.config/autostart/*.desktop（见 commands/shell.rs）
#   全局热键 → 降级为窗口内快捷键（V10 上不注册系统级热键，避免 X11 依赖）
#   检测更新 → 内网离线部署，固定返回"未配置"

[features]
# 注意：custom-protocol **不在 default**（与 tauri 官方模板一致：tauri dev 走 devUrl
# 热重载不需要它，tauri build 会由 CLI 自动带上）。但**裸 cargo build 出的二进制
# 必须显式启用**：`cargo build -p search-tool --features custom-protocol`。
# 否则 generate_context! 判定 dev=true + devUrl 存在 → 嵌入空资产 →
# tauri://localhost 404 空响应 + wry 透明黑背景 = 纯黑屏（2026-10-16 实测根因）。
custom-protocol = ["tauri/custom-protocol"]

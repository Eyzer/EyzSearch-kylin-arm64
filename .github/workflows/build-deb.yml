name: build-deb

# 手动触发：在原生 arm64 runner 上构建可内网部署的 deb（含 sjz 解密 + 离线 OCR）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb-arm64:
    name: arm64 deb (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config dpkg-dev patchelf \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: pnpm
        run: npm i -g pnpm

      - name: 构建 deb
        run: bash scripts/build-arm64-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: search-tool-deb-arm64
          path: build/*.deb
          if-no-files-found: error
